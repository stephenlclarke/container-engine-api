name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: Format, build, and test
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install quality tools
        run: brew install markdownlint-cli swiftformat
      - name: Verify exact dependency resolution
        run: |
          cp Package.resolved /tmp/container-engine-api-Package.resolved
          swift package resolve
          cmp /tmp/container-engine-api-Package.resolved Package.resolved
      - name: Validate formatting and documentation
        run: |
          python3 Tools/generate_route_ledger.py --check
          PYTHONPYCACHEPREFIX="${RUNNER_TEMP}/container-engine-python-cache" python3 -m py_compile Tools/performance/*.py
          python3 -B Tools/performance/check_engine_streaming_performance.py --self-test
          bash -n Tools/ci/*.sh
          swiftformat --lint Package.swift Sources Tests Tools/ContainerEngineStreamingPerformanceFixture
          markdownlint README.md docs
      - name: Build tests
        run: |
          swift build --disable-automatic-resolution -Xswiftc -warnings-as-errors --build-tests
          swift build --disable-automatic-resolution -Xswiftc -warnings-as-errors --target ContainerEngineStreamingPerformanceFixture
      - name: Run tests
        timeout-minutes: 5
        run: |
          test_bin_path="$(swift build --disable-automatic-resolution --show-bin-path)"
          Tools/ci/run-swift-testing-bundle.sh \
            "$test_bin_path/container-engine-apiPackageTests.xctest/Contents/MacOS/container-engine-apiPackageTests" \
            --no-parallel

  documentation:
    name: Build DocC documentation
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate static DocC site
        run: scripts/make-docs.sh _site api/container-engine-api
      - name: Archive DocC site
        run: tar -czf "${RUNNER_TEMP}/container-engine-api-docc.tgz" -C _site .
      - name: Upload DocC artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-engine-api-docc
          path: ${{ runner.temp }}/container-engine-api-docc.tgz
          retention-days: 7

  validate:
    name: Validate
    if: always()
    needs: [test, documentation]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful validation
        env:
          DOCUMENTATION_RESULT: ${{ needs.documentation.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: test "$TEST_RESULT" = success && test "$DOCUMENTATION_RESULT" = success
