sonar.projectKey=stephenlclarke_container-engine-api
sonar.organization=stephenlclarke
sonar.projectName=container-engine-api
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8
sonar.sources=Sources
sonar.tests=Tests
sonar.exclusions=**/.build/**,**/*.pb.swift,**/*.grpc.swift
sonar.test.inclusions=Tests/**/*.swift
sonar.coverageReportPaths=coverage.xml

# RFC 6455 requires SHA-1 for the WebSocket accept-key transform. This digest
# authenticates no credential or content and cannot be substituted.
sonar.issue.ignore.multicriteria=webSocketAcceptDigest
sonar.issue.ignore.multicriteria.webSocketAcceptDigest.ruleKey=swift:S4790
sonar.issue.ignore.multicriteria.webSocketAcceptDigest.resourceKey=Sources/ContainerUnixHTTPServer/ContainerUnixHTTPServer.swift
