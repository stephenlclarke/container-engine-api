sonar.projectKey=stephenlclarke_container-engine-api
sonar.organization=stephenlclarke
sonar.projectName=container-engine-api
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8
sonar.sources=Sources
sonar.tests=Tests
sonar.exclusions=**/.build/**,**/*.pb.swift,**/*.grpc.swift,**/*.generated.swift
sonar.test.inclusions=Tests/**/*.swift
sonar.coverageReportPaths=coverage.xml

# RFC 6455 requires SHA-1 for the WebSocket accept-key transform. Existing
# stable protocol signatures, fixed wire paths, and callback bridges are
# accepted by exact issue in SonarQube so their rules remain enabled for every
# future occurrence.
sonar.issue.ignore.multicriteria=webSocketAcceptDigest
sonar.issue.ignore.multicriteria.webSocketAcceptDigest.ruleKey=swift:S4790
sonar.issue.ignore.multicriteria.webSocketAcceptDigest.resourceKey=Sources/ContainerUnixHTTPServer/WebSocketAcceptDigest.swift
