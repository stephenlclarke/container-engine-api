sonar.projectKey=stephenlclarke_container-engine-api
sonar.organization=stephenlclarke
sonar.projectName=container-engine-api
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8
sonar.sources=Sources
sonar.tests=Tests
sonar.exclusions=**/.build/**,**/*.pb.swift,**/*.grpc.swift,**/*.generated.swift
sonar.test.inclusions=Tests/**/*.swift
sonar.coverageReportPaths=coverage.xml

# RFC 6455 requires SHA-1 for the WebSocket accept-key transform. Docker route
# strings and health paths are wire-protocol constants, not deployable resource
# locations. Handoff/lifecycle initializers mirror stable public protocol shapes;
# grouping them would break source compatibility. The closure bridges below
# deliberately nest Swift concurrency, POSIX callback, and NIO cancellation
# scopes so each resource retains its correct lifetime.
sonar.issue.ignore.multicriteria=webSocketAcceptDigest,dockerLoggingRoutes,dockerRouteTarget,resourceIntentPaths,healthProbePaths,handoffModels,handoffEnvelope,handoffPayload,handoffLogging,handoffProviderKeys,lifecycleV2,handoffCrypto,handoffSourceControl,handoffBundleStoreParameters,handoffGatewayKeys,sourceHandoffResponder,loggingControllerParameters,loggingBackendParameters,gatewayCoordinatorParameters,unixServerLimits,bundleObjectStoreClosures,providerSessionClosures,unixServerClosures
